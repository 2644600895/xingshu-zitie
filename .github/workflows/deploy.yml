name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject PAT into index.html
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 -c "import os; p='index.html'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(s.replace('__GH_TOKEN__', os.environ['GH_PAT']))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
